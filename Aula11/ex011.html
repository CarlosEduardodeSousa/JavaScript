<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da aula 11</title>
</head>
<body>
    <h1>Desafio da Aula 11</h1>
    Digite o pais que você nasceu <input type="text" name="pais" id="pais">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>

    <script>
        function verificar(){
            var txtpais = document.querySelector('#pais')
            var res = document.querySelector('#res')
            var pais = (txtpais.value)
            
            res.innerHTML = `<p>Vivendo no/a <strong>${pais}</strong></p>`

            if (pais == "Brasil"){
                res.innerHTML += `<p>Você é <strong>Brasileiro!</strong></p>`
            }
            else{
                res.innerHTML += `<p>Você é <strong>Estrangeiro!</strong></p>`
            }
        }
    </script>
</body>
</html>
