<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de dados</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 35px;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt("Qual é o seu nome?")
        document.write(`Olá, <strong>${nome}</strong>!, Seu nome tem ${nome.length} letras <br>`)
        document.write(`Seu nome em maiúsculas é ${nome.toUpperCase()} <br>`)
        document.write(`Seu nome em minúsculas é ${nome.toLowerCase()} <br>`)

        var sal = Number(window.prompt("Digite o seu salário: "))
        document.write("Salario: " + sal.toLocaleString('pt-BR', {style:"currency", currency: 'BRL'}))

        /*toFixed() arruma números decimais*/
        /*to.Fixed().replace('.' , ',') Substitui ponto por virgula*/
        /*toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) coloca o número para a moeda local*/
    </script>
</body>
</html>
